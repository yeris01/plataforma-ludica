# Verificaciones que se ejecutan antes de cada commit.
# Se activan con: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check
        language: system
        types: [python]
      - id: pytest
        name: Pruebas
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
