name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Revisar el estilo con Ruff
        run: ruff check .

      - name: Ejecutar las pruebas
        run: pytest -v

      - name: Comprobar que la aplicación arranca
        run: |
          uvicorn app.main:app --port 8000 &
          for intento in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/salud; then exit 0; fi
            sleep 1
          done
          echo "La aplicación no respondió en /salud"
          exit 1
